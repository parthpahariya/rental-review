name: Test, build, and publish

on:
  push:
    branches: [main, topic/parth/plan]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rental_test
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rental -d rental_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://rental:rental_test@localhost:5432/rental_test
      APP_ENV: test
    defaults:
      run:
        working-directory: python/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: python/backend/report.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronend/webUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fronend/webUI/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: fronend/webUI/dist

  compose-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: rental-review-ci
      WEB_PORT: 8080
      API_PORT: 8000
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke.py http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: [compose-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: python/backend
          - service: web
            context: fronend/webUI
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image repository
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy immutable images over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_ROOT: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: bash scripts/deploy-ci.sh
