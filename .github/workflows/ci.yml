name: Test, build, and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Branch that deploys to the Google Cloud VM (shared with meal-manager).
  # Keep in sync with the push filter above and the deploy job's `if`.
  DEPLOY_BRANCH: main

concurrency:
  group: ci-${{ github.ref }}
  # Supersede stale pull-request checks, but never cancel a deployment midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same PostgreSQL as production (postgres-platform) and meal-manager.
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: rental_test
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rental -d rental_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://rental:rental_test@localhost:5432/rental_test
      APP_ENV: test
    defaults:
      run:
        working-directory: python/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: python/backend/report.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fronend/webUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: fronend/webUI/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: fronend/webUI/dist

  compose-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: rental-review-ci
      WEB_PORT: 8080
      API_PORT: 8000
      # Branch of github.com/parthpahariya/postgres-platform to test against.
      PLATFORM_REF: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Shared PostgreSQL (postgres-platform, cloned beside the app)
        run: |
          git clone --quiet --depth 1 --branch "$PLATFORM_REF" \
            https://github.com/parthpahariya/postgres-platform.git ../postgres-platform
          python3.13 ../postgres-platform/bin/ensure-db rental_review
      - run: docker compose config --quiet
      - name: Validate deployment scripts and production configuration
        env:
          SECRET_KEY: validation-only-secret-key-that-is-long-enough
          GOOGLE_CLIENT_IDS: validation-only.apps.googleusercontent.com
        run: |
          bash -n deploy/*.sh
          python3 -m unittest discover -s deploy/tests -v
          docker compose -f compose.yaml -f compose.production.yaml config --quiet
          bash deploy/check-nginx.sh
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python3 scripts/smoke.py http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    needs: [compose-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: python/backend
          - service: web
            context: fronend/webUI
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image repository
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Bootstrap VM and deploy
    needs: [backend, frontend, compose-smoke]
    # Same flow as meal-manager: SSH into the VM, check out this exact commit, then
    # build and start it with Compose behind host Nginx + Let's Encrypt.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://rentalreview.boringman.in
    concurrency:
      group: rental-review-production
      cancel-in-progress: false
    env:
      GCP_VM_HOST: ${{ vars.GCP_VM_HOST }}
      GCP_VM_USER: ${{ vars.GCP_VM_USER }}
      GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
      MAP_PROVIDER: ${{ vars.MAP_PROVIDER }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
      GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
      HERE_API_KEY: ${{ vars.HERE_API_KEY }}
      MAPBOX_ACCESS_TOKEN: ${{ vars.MAPBOX_ACCESS_TOKEN }}
      OLA_MAPS_API_KEY: ${{ vars.OLA_MAPS_API_KEY }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
      GCP_SSH_KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash deploy/ci-deploy.sh github
