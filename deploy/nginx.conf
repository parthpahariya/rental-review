# Keep HTTP available for certificate validation and renewal.
server {
    listen 80;
    listen [::]:80;
    server_name rentalreview.boringman.in;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://rentalreview.boringman.in$request_uri;
    }
}

# Host TLS termination. The web container serves React and proxies /api to FastAPI.
# Named site (not default_server) so it can share the VM with meal-manager.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rentalreview.boringman.in;
    ssl_certificate /etc/letsencrypt/live/rentalreview.boringman.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentalreview.boringman.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Uploads are capped at 5 MB by the API; the web container allows 6 MB.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
