# First-run site while Certbot obtains the certificate. Matched by name only:
# meal-manager's site on this VM is the default_server.
server {
    listen 80;
    listen [::]:80;
    server_name rentalreview.boringman.in;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://rentalreview.boringman.in$request_uri;
    }
}
