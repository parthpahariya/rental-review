# Android CI/CD only; iOS has its own file (ios.yml). Included by .gitlab/ci.yml.
# Checks are lint + a debug build; the app has no tests.

android-check:
  stage: test
  image: ghcr.io/cirruslabs/android-sdk:36
  timeout: 30m
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - bash ci/android.sh check
  artifacts:
    paths: [frontend/mobileUI/android/app/build/outputs/apk/debug/]
    expire_in: 7 days

# Pushes to the protected release branch (main) that touch Android files build a
# signed release; it is uploaded to Google Play only when PLAY_PUBLISH_ENABLED is true.
android-play:
  stage: deploy
  # Packages the release build in one Gradle run, so it need not wait for android-check.
  needs: []
  image: ghcr.io/cirruslabs/android-sdk:36
  timeout: 45m
  interruptible: false
  environment:
    name: play
  # APP_BASE_URL (optional) overrides the site; it defaults to https://rentalreview.boringman.in.
  # Signing: ANDROID_KEYSTORE_BASE64 (or a File variable), ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD; uploads: PLAY_SERVICE_ACCOUNT_JSON.
  resource_group: play
  variables:
    # Project CI/CD variables of the same names override these defaults.
    PLAY_TRACK: internal
    PLAY_RELEASE_STATUS: draft
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
      changes:
        - frontend/mobileUI/android/**/*
        - ci/android.sh
        - ci/play_upload.py
        - .gitlab/android.yml
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv && rm -rf /var/lib/apt/lists/*
  script:
    - bash ci/android.sh release
  artifacts:
    paths: [dist/android/]
    expire_in: 30 days
