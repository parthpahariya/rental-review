stages: [test, smoke, publish, deploy]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH || $CI_COMMIT_TAG"

backend:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: rental_test
    POSTGRES_USER: rental
    POSTGRES_PASSWORD: rental_test
    DATABASE_URL: postgresql+psycopg://rental:rental_test@postgres:5432/rental_test
    APP_ENV: test
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        [python/backend/requirements.txt, python/backend/requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - cd python/backend
    - pip install -r requirements-dev.txt
    - python ../../scripts/wait_for_db.py
  script:
    - ruff check .
    - alembic upgrade head
    - alembic check
    - pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: python/backend/report.xml

frontend:
  stage: test
  image: node:24-alpine
  cache:
    key:
      files: [fronend/webUI/package-lock.json]
    paths: [fronend/webUI/.npm]
  before_script:
    - cd fronend/webUI
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test
    - npm run build
  artifacts:
    paths: [fronend/webUI/dist]
    expire_in: 7 days

.docker:
  image: docker:28-cli
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info

compose-smoke:
  extends: .docker
  stage: smoke
  variables:
    COMPOSE_PROJECT_NAME: rental-review-ci
    COMPOSE_FILE: compose.yaml:compose.ci.yaml
  script:
    - apk add --no-cache python3
    - docker compose config --quiet
    - docker compose up --build -d --wait --wait-timeout 180
    - python3 scripts/smoke.py http://docker:8080
  after_script:
    - docker compose logs --no-color --tail=100
    - docker compose down --volumes --remove-orphans

publish:
  extends: .docker
  stage: publish
  parallel:
    matrix:
      - SERVICE: backend
        CONTEXT: python/backend
      - SERVICE: web
        CONTEXT: fronend/webUI
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE/$SERVICE:sha-$CI_COMMIT_SHA" "$CONTEXT"
    - docker push "$CI_REGISTRY_IMAGE/$SERVICE:sha-$CI_COMMIT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE/$SERVICE:sha-$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/$SERVICE:latest"
        docker push "$CI_REGISTRY_IMAGE/$SERVICE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE/$SERVICE:sha-$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE/$SERVICE:$CI_COMMIT_TAG"
      fi

deploy:
  stage: deploy
  image: alpine:3.22
  environment:
    name: production
  resource_group: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/ && $ENABLE_DEPLOY == "true"'
      when: manual
  before_script:
    - apk add --no-cache bash openssh-client
  script:
    - export IMAGE_ROOT="$CI_REGISTRY_IMAGE" IMAGE_TAG="sha-$CI_COMMIT_SHA"
    - bash scripts/deploy-ci.sh
