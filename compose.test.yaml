# Isolated PostgreSQL and backend tooling. Never targets the application database.
services:
  db:
    environment:
      POSTGRES_DB: rental_test
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_test
    volumes: !override
      - postgres_test_data:/var/lib/postgresql/data
  backend:
    image: rental-review-backend:test
    build:
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://rental:rental_test@db:5432/rental_test
      APP_ENV: test
      SMS_BACKEND: development
      SECRET_KEY: test-only-private-key-for-integration-testing
      SEED_DEMO_DATA: "false"
    user: root
    volumes: !override
      - ./python/backend:/app
    ports: !reset []
    restart: "no"
    command: [pytest, -q]
volumes:
  postgres_test_data:
