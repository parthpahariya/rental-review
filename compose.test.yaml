# Isolated PostgreSQL and backend tooling for `make test-backend`. Never touches the
# shared database: tests get their own throwaway PostgreSQL (the same version, 18.6).
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: rental_test
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental_test
    volumes:
      - postgres18_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental_test"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [test]
  backend:
    image: rental-review-backend:test
    build:
      target: test
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql+psycopg://rental:rental_test@db:5432/rental_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://rental:rental_test@db:5432/rental_test
      APP_ENV: test
      SECRET_KEY: test-only-private-key-for-integration-testing
      SEED_DEMO_DATA: "false"
    user: root
    volumes: !override
      - ./python/backend:/app
    ports: !reset []
    restart: "no"
    networks: !override [test]
    depends_on:
      db: { condition: service_healthy }
    command: [pytest, -q]
volumes:
  postgres18_test_data:
networks:
  test:
