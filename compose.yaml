name: rental-review

# Shared log settings for every service.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  backend:
    image: ${BACKEND_IMAGE:-rental-review-backend:local}
    build:
      context: ./python/backend
      target: runtime
    develop:
      watch:
        - action: rebuild
          path: ./python/backend
          ignore:
            - .env*
            - .venv/
            - "**/__pycache__/"
            - .pytest_cache/
            - .ruff_cache/
            - uploads/
            - "*.pyc"
    # The database is the shared PostgreSQL from ../postgres-platform (run `make db`).
    # DATABASE_URL (writer, used by the API) and MIGRATION_DATABASE_URL (owner, used
    # by `alembic upgrade head` at start-up) come from its generated credentials files.
    env_file:
      - ${PLATFORM_DIR:-../postgres-platform}/credentials/rental_review.env
      - ${PLATFORM_DIR:-../postgres-platform}/credentials/rental_review.migrate.env
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-before-deployment}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      MAP_PROVIDER: ${MAP_PROVIDER:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      HERE_API_KEY: ${HERE_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      OLA_MAPS_API_KEY: ${OLA_MAPS_API_KEY:-}
      ADS_PROVIDER: ${ADS_PROVIDER:-}
      ADSENSE_CLIENT: ${ADSENSE_CLIENT:-}
      ADSENSE_SLOT_HOME: ${ADSENSE_SLOT_HOME:-}
      ADSENSE_SLOT_LIST: ${ADSENSE_SLOT_LIST:-}
      ADSENSE_SLOT_PLACE: ${ADSENSE_SLOT_PLACE:-}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080},http://localhost:5173
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${BACKEND_MEMORY_LIMIT:-384m}
    mem_reservation: 128m
    memswap_limit: ${BACKEND_MEMORY_LIMIT:-384m}
    cpus: 1.0
    pids_limit: 100
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [shared-postgres, edge]
    logging: *logging

  web:
    image: ${WEB_IMAGE:-rental-review-web:local}
    build: ./fronend/webUI
    develop:
      watch:
        - action: rebuild
          path: ./fronend/webUI
          ignore:
            - node_modules/
            - dist/
            - .env*
            - "*.tsbuildinfo"
            - coverage/
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    mem_reservation: 32m
    memswap_limit: ${WEB_MEMORY_LIMIT:-128m}
    cpus: 0.5
    pids_limit: 50
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [edge]
    logging: *logging

volumes:
  uploads:

networks:
  # Created by postgres-platform; the shared container is reachable as shared-postgres.
  shared-postgres:
    external: true
  edge:
